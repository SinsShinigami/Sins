<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kopi Espresso - Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Figtree', sans-serif;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .main-container {
            position: relative;
            width: 1920px;
            height: 1080px;
            background: linear-gradient(180deg, #c6c6c6 0%, #ddb661 100%);
        }

        .background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1103px;
            object-fit: cover;
            z-index: 1;
        }

        .login-container {
            position: absolute;
            top: 287px;
            left: 745px;
            width: 429px;
            height: 555px;
            background: rgba(217, 217, 217, 0.09);
            border-radius: 18px;
            border: 3px solid;
            border-image: linear-gradient(137deg, #ffffff 0%, rgba(255, 255, 255, 0) 100%) 1;
            box-shadow: -38px 38px 38px rgba(255, 255, 255, 0.09);
            backdrop-filter: blur(10px);
            z-index: 2;
            padding: 0;
        }

        .logo {
            position: absolute;
            top: 14px;
            left: 92px;
            width: 244px;
            height: 112px;
            z-index: 3;
        }

        .input-group {
            position: relative;
            margin-bottom: 40px;
        }

        .id-input-group {
            position: absolute;
            top: 210px;
            left: 46px;
            width: 354px;
        }

        .password-input-group {
            position: absolute;
            top: 321px;
            left: 46px;
            width: 354px;
        }

        .input-label {
            font-size: 20px;
            font-family: 'Figtree', sans-serif;
            font-weight: 300;
            line-height: 24px;
            letter-spacing: 2px;
            text-transform: capitalize;
            color: #ffffff;
            margin-bottom: 15px;
            display: block;
        }

        .input-field {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid #ffffff;
            padding: 10px 40px 10px 0;
            font-size: 18px;
            color: #ffffff;
            outline: none;
            font-family: 'Figtree', sans-serif;
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .input-field:focus {
            border-bottom-color: #ddb661;
        }

        .input-icon {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 25px;
            height: 25px;
        }

        .id-icon {
            top: 35px;
            right: 0;
        }

        .password-icon {
            top: 35px;
            right: 5px;
            width: 20px;
            height: 23px;
        }

        .login-button {
            position: absolute;
            top: 435px;
            left: 71px;
            width: 288px;
            height: 60px;
            background-color: #ffffff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 4;
        }

        .login-button:hover {
            background-color: #f0f0f0;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .login-button:active {
            transform: translateY(0);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .login-text {
            font-size: 20px;
            font-family: 'Figtree', sans-serif;
            font-weight: 700;
            line-height: 24px;
            letter-spacing: 2px;
            text-transform: capitalize;
            color: #000000;
            text-align: center;
            margin: 0;
            padding-top: 18px;
        }

        .error-message {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        .success-message {
            color: #4ecdc4;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        @media (max-width: 768px) {
            .main-container {
                width: 100vw;
                height: 100vh;
            }

            .background-image {
                width: 100vw;
                height: 100vh;
            }

            .login-container {
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 90%;
                max-width: 400px;
                height: auto;
                padding: 40px 30px;
            }

            .logo {
                position: relative;
                top: 0;
                left: 50%;
                transform: translateX(-50%);
                margin-bottom: 40px;
            }

            .id-input-group,
            .password-input-group {
                position: relative;
                top: auto;
                left: auto;
                width: 100%;
                margin-bottom: 30px;
            }

            .login-button {
                position: relative;
                top: auto;
                left: auto;
                width: 100%;
                margin-top: 20px;
            }
        }

        @media (max-width: 480px) {
            .login-container {
                width: 95%;
                padding: 30px 20px;
            }

            .input-label {
                font-size: 18px;
            }

            .input-field {
                font-size: 16px;
            }

            .login-text {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Background Image -->
        <img src="../assets/images/img_download_1.png" alt="Coffee background with beans and cup" class="background-image">
        
        <!-- Login Form Container -->
        <div class="login-container">
            <!-- Logo -->
            <img src="../assets/images/img_group_5.svg" alt="Kopi Espresso Logo" class="logo">
            
            <!-- ID Input Group -->
            <div class="id-input-group">
                <label for="user-id" class="input-label">ID</label>
                <input type="text" id="user-id" class="input-field" placeholder="Enter your ID" required>
                <img src="../assets/images/img_vector.svg" alt="User icon" class="input-icon id-icon">
                <div class="error-message" id="id-error">Please enter a valid ID</div>
            </div>
            
            <!-- Password Input Group -->
            <div class="password-input-group">
                <label for="password" class="input-label">Password</label>
                <input type="password" id="password" class="input-field" placeholder="Enter your password" required>
                <img src="../assets/images/img_vector_white_a700.svg" alt="Lock icon" class="input-icon password-icon">
                <div class="error-message" id="password-error">Please enter your password</div>
            </div>
            
            <!-- Login Button -->
            <button type="submit" class="login-button" onclick="handleLogin()">
                <span class="login-text">Login</span>
            </button>
            
            <div class="success-message" id="success-message">Login successful! Redirecting...</div>
        </div>
    </div>

    <script>
        // Form validation and login functionality
        function validateForm() {
            const userId = document.getElementById('user-id').value.trim();
            const password = document.getElementById('password').value.trim();
            const idError = document.getElementById('id-error');
            const passwordError = document.getElementById('password-error');
            
            let isValid = true;
            
            // Reset error messages
            idError.style.display = 'none';
            passwordError.style.display = 'none';
            
            // Validate ID
            if (!userId) {
                idError.textContent = 'Please enter your ID';
                idError.style.display = 'block';
                isValid = false;
            } else if (userId.length < 3) {
                idError.textContent = 'ID must be at least 3 characters';
                idError.style.display = 'block';
                isValid = false;
            }
            
            // Validate Password
            if (!password) {
                passwordError.textContent = 'Please enter your password';
                passwordError.style.display = 'block';
                isValid = false;
            } else if (password.length < 6) {
                passwordError.textContent = 'Password must be at least 6 characters';
                passwordError.style.display = 'block';
                isValid = false;
            }
            
            return isValid;
        }
        
        function handleLogin() {
            if (validateForm()) {
                const successMessage = document.getElementById('success-message');
                const loginButton = document.querySelector('.login-button');
                
                // Show loading state
                loginButton.innerHTML = '<span class="login-text">Logging in...</span>';
                loginButton.disabled = true;
                
                // Simulate login process
                setTimeout(() => {
                    successMessage.style.display = 'block';
                    
                    // Simulate redirect after successful login
                    setTimeout(() => {
                        alert('Welcome to Kopi Espresso! Redirecting to dashboard...');
                        // In a real application, you would redirect to the dashboard
                        // window.location.href = '/dashboard';
                        
                        // Reset form for demo purposes
                        document.getElementById('user-id').value = '';
                        document.getElementById('password').value = '';
                        successMessage.style.display = 'none';
                        loginButton.innerHTML = '<span class="login-text">Login</span>';
                        loginButton.disabled = false;
                    }, 2000);
                }, 1000);
            }
        }
        
        // Add enter key support
        document.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                handleLogin();
            }
        });
        
        // Add input focus effects
        const inputFields = document.querySelectorAll('.input-field');
        inputFields.forEach(field => {
            field.addEventListener('focus', function() {
                this.parentElement.style.transform = 'scale(1.02)';
                this.parentElement.style.transition = 'transform 0.3s ease';
            });
            
            field.addEventListener('blur', function() {
                this.parentElement.style.transform = 'scale(1)';
            });
        });
        
        // Password visibility toggle (optional enhancement)
        function togglePasswordVisibility() {
            const passwordField = document.getElementById('password');
            const passwordIcon = document.querySelector('.password-icon');
            
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                passwordIcon.style.opacity = '0.7';
            } else {
                passwordField.type = 'password';
                passwordIcon.style.opacity = '1';
            }
        }
        
        // Add click event to password icon for visibility toggle
        document.querySelector('.password-icon').addEventListener('click', togglePasswordVisibility);
        
        // Add hover effects to icons
        const icons = document.querySelectorAll('.input-icon');
        icons.forEach(icon => {
            icon.style.cursor = 'pointer';
            icon.addEventListener('mouseenter', function() {
                this.style.transform = 'scale(1.1)';
                this.style.transition = 'transform 0.2s ease';
            });
            
            icon.addEventListener('mouseleave', function() {
                this.style.transform = 'scale(1)';
            });
        });
    </script>
</body>
</html>
